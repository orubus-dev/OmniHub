name: Build & Release APK

# Only workflow in this repo. One build at a time; workflow-only commits do not rebuild.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'nightly (default) or stable'
        required: false
        default: 'nightly'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'

# Cancel older runs when a new one starts (stops stacked #191/#192/#193 waste)
concurrency:
  group: omnihub-build-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          set -e
          # ubuntu-latest ships the SDK; the old setup-android action broke
          # trying to install the removed 'tools' package. Accept licenses and
          # ensure the components AGP 8.5 + compileSdk 35 need.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -20 || true

      - name: Restore Gradle Wrapper
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradlew \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew"
          chmod +x gradlew
          printf '%s\n' \
            'distributionBase=GRADLE_USER_HOME' \
            'distributionPath=wrapper/dists' \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' \
            'networkTimeout=60000' \
            'validateDistributionUrl=true' \
            'zipStoreBase=GRADLE_USER_HOME' \
            'zipStorePath=wrapper/dists' \
            > gradle/wrapper/gradle-wrapper.properties

      - name: Prime Gradle distribution (retry — services.gradle.org stalls on new runner images)
        run: |
          set -e
          ok=0
          for i in 1 2 3 4 5; do
            if ./gradlew --version > /tmp/gradle_ver.log 2>&1; then
              ok=1
              echo "gradle ready on attempt $i"
              break
            fi
            echo "attempt $i failed:"; tail -5 /tmp/gradle_ver.log || true
            rm -rf ~/.gradle/wrapper/dists
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "Gradle distribution unreachable after 5 attempts"; exit 1; }

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "FATAL: KEYSTORE_BASE64 missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Read versionName
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          if [ -z "$VN" ]; then VN="1.0.9.8"; fi
          echo "version=$VN" >> $GITHUB_OUTPUT
          echo "Resolved versionName=$VN"

      - name: Decide channel
        id: meta
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          if [ -z "$CHANNEL" ]; then CHANNEL=nightly; fi
          if [ "${{ github.event_name }}" = "push" ]; then CHANNEL=nightly; fi
          VN="${{ steps.ver.outputs.version }}"
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          if [ "$CHANNEL" = "stable" ]; then
            echo "tag=v${VN}" >> $GITHUB_OUTPUT
            echo "name=OmniHub v${VN}" >> $GITHUB_OUTPUT
            echo "apk=OmniHub-v${VN}.apk" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          else
            echo "tag=v${VN}-nightly.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=OmniHub ${VN} Nightly #${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "apk=OmniHub-${VN}-nightly.apk" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: |
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            if ./gradlew clean assembleRelease --stacktrace 2>&1 | tee build.log; then
              ok=1; break
            fi
            # Retry only infra-shaped failures (wrapper/network), not compile errors
            if grep -qE "SocketTimeout|UnknownHostException|Install.forceFetch|Connection reset" build.log; then
              echo "infra failure on attempt $i — retrying"; sleep 20; continue
            fi
            break
          done
          [ "$ok" = "1" ] || { tail -80 build.log; exit 1; }
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          SIZE=$(wc -c < "$APK")
          test "$SIZE" -gt 500000
          cp "$APK" "./${{ steps.meta.outputs.apk }}"
          ls -lah "./${{ steps.meta.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: ${{ steps.meta.outputs.apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: true
          body: |
            ## ${{ steps.meta.outputs.name }}

            App versionName: **${{ steps.ver.outputs.version }}**
            Channel: **${{ steps.meta.outputs.channel }}**

            ### 1.1.0.1 — Accuracy: duck.ai is now a real endpoint, the composer mess is gone
            - **duck.ai API lane**: the warm duck.ai WebView now calls
              duckchat/v1/status → solves the challenge in its own real browser
              runtime → streams duckchat/v1/chat SSE. Real multi-turn (no more
              context-prefix typing on duck), real model selection
              (gpt-5.4-mini / claude-haiku-4-5 / gpt-6-luna / gpt-oss-120b),
              first token in ~2-6s. The orubus-ai route-d technique, fused with
              WarmSessionPool — the browser IS the solver. Composer relay stays
              as automatic fallback.
            - **No more word bans**: the chrome-phrase blocklist that deleted
              real answers (and faked REPLY_TIMEOUTs) is gone. Chrome is
              removed structurally — the reply node is cloned and its buttons,
              toolbars, footers and disclaimers are stripped by DOM before
              text is read. A visible answer can no longer become an error.
            - **Transcript-delta fallback**: providers with no recognizable
              reply nodes (Meta AI family) now complete via a before/after
              snapshot diff of the conversation region.
            - **Submission ladder**: typed text is read back from the field
              before submit (kills "stuck in the composer"), then send click →
              Enter → form-submit, each verified by progress signals, 3
              rounds. Failed sends clear the composer — nothing sticks around.
            - **Popups die at the bridge**: geolocation and runtime permission
              prompts are denied in the WebView chrome client (the duck.ai
              "Share your precise location" wall is gone).
            - **Memory rebuilt at the root**: soul memory distills from the
              user's turns only — AI prose (stories, roleplay) can never
              pollute memory again. Legacy polluted units are migrated away on
              first launch; memory context hard-capped at 700 chars.
            - **Speed**: observation starts at submit, polls tightened to
              60ms, lean context prefix (~1600 chars max), completion
              quiet-window ~300ms.

            Install the APK attached to this release.
          files: ${{ steps.meta.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
